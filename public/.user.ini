; Raises PHP's own upload limits so admin uploads up to 15 MB are not rejected
; before they ever reach Laravel's validation rules.
; Works with PHP-FPM / CGI setups that honor .user.ini (most shared hosting).
; If your server uses mod_php (Apache) or has "user_ini.filename" disabled,
; edit php.ini or your vhost config directly instead — see CHANGELOG for details.

upload_max_filesize = 20M
post_max_size = 25M
